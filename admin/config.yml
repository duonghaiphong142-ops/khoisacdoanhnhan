# ====== CẤU HÌNH TRANG QUẢN TRỊ (Decap CMS) ======
# Đã điền sẵn tên tài khoản GitHub
backend:
  name: github
  repo: duonghaiphong142-ops/khoisacdoanhnhan
  branch: main

site_url: https://khoisacdoanhnhan.net
media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: baiviet
    label: "Bài viết"
    files:
      - name: posts
        label: "Danh sách bài viết"
        file: data/posts.json
        fields:
          - label: "Bài viết"
            name: posts
            widget: list
            add_to_top: true
            summary: "{{fields.title}}"
            label_singular: "bài viết"
            fields:
              - {label: "Tiêu đề", name: title, widget: string}
              - label: "Chuyên mục"
                name: cat
                widget: select
                options: ["Thời sự","Thế giới","Pháp luật","Kinh doanh","Công nghệ","Xe","Du lịch","Nhịp sống trẻ","Văn hóa","Giải trí","Thể thao","Giáo dục","Nhà đất","Sức khỏe","Giả - Thật","Bạn đọc","Khoa học"]
                default: "Thời sự"
              - {label: "Tác giả", name: author, widget: string, required: false}
              - {label: "Ngày đăng", name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ"}
              - {label: "Sapo (đoạn mở đầu)", name: sapo, widget: text}
              - label: "Nội dung"
                name: body
                widget: markdown
                buttons: ["heading-two"]
                editor_components: ["image"]
                hint: "Mỗi đoạn cách nhau một dòng trống. Dùng nút + / Image để chèn ảnh vào giữa bài; phần 'alt' là chú thích ảnh."
              - {label: "Ảnh bìa", name: cover, widget: image, required: false}
              - {label: "Nguồn ảnh bìa", name: coverCredit, widget: string, required: false}
              - {label: "Link nguồn tham khảo", name: src, widget: string, required: false}
              - {label: "Đưa lên bài nổi bật đầu trang", name: featured, widget: boolean, default: false}
